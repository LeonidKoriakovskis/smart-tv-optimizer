name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Grant Execute Permission to gradlew (if present)
        run: chmod +x android/gradlew || true

      - name: Build Android Release APK
        working-directory: android
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename Output APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/*.apk output/Smart-TV-Optimizer.apk
          ls -lh output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-TV-Optimizer-APK
          path: output/Smart-TV-Optimizer.apk

      - name: Attach APK to GitHub Release v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 output/Smart-TV-Optimizer.apk --clobber || true
